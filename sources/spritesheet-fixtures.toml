# spritesheet-fixtures — texture atlas and spritesheet descriptors.
#
# flight reads five atlas dialects across two packages (spritesheet-formats and
# textureatlas-formats): libgdx, TexturePacker, Starling, Cocos plist and Aseprite.
# Four dialects covered: libgdx .atlas, the Cocos property list, the frames+meta JSON that
# TexturePacker and Aseprite both emit, and Starling's SubTexture XML.
#
# Worth recording, because it looked like a gap that was not one: TexturePacker has no
# "native" output format of its own. It is an exporter that emits whichever framework format
# you ask for, and texturePackerParse reads the frames+meta JSON — so that dialect was
# already covered. The CodeAndWeb example repositories ship .tps PROJECT files plus outputs
# in other frameworks' formats, which is a different thing from a corpus.
#
# Only the DESCRIPTORS are taken, never the artwork they point at. A spritesheet parser is
# exercised entirely by the descriptor — frame rectangles, rotation flags, trim offsets — and
# the images would add weight plus, in cocos2d-x's case, a separate and more restrictive
# artwork licence.

[pack]
name = "spritesheet-fixtures"
kind = "fixtures"
merge_group = "cocos2dx"
summary = "Texture atlas descriptors — libgdx .atlas dialect, with page and region metadata."

[[source]]
id = "libgdx-atlas"
kind = "upstream"
repo = "libgdx/libgdx"
ref = "master"
fetch = "blobs"
include = [
  "tests/gdx-tests-android/assets/**/*.atlas",
  "extensions/gdx-tools/assets/**/*.atlas",
  # Referenced by the descriptors above: without these they parse but cannot render.
  "tests/gdx-tests-android/assets/**/**/*.png",
  "tests/gdx-tests-android/assets/**/**/*.jpg",
  "tests/gdx-tests-android/assets/**/**/*.jpeg",
  "tests/gdx-tests-android/assets/**/**/*.bmp",
  "extensions/gdx-tools/assets/**/**/*.png",
  "extensions/gdx-tools/assets/**/**/*.jpg",
  "extensions/gdx-tools/assets/**/**/*.jpeg",
  "extensions/gdx-tools/assets/**/**/*.bmp",
]
strip = ""
dest = "libgdx/"

[source.license]
declared = "Apache-2.0"
declared_scope = "repository-root"
declared_from = "LICENSE"
commercial_use = true
onward_use = "unrestricted"
covers = "libgdx and its bundled test assets."


# ---------------------------------------------------------------------------
# Cocos property-list spritesheets: a completely different serialisation of the same model,
# which is exactly the kind of second dialect that catches assumptions baked into the first.
# ---------------------------------------------------------------------------
[[source]]
id = "cocos2dx-plist-sheets"
kind = "upstream"
repo = "cocos2d/cocos2d-x"
ref = "v4"
fetch = "blobs"
include = ["tests/**/*.plist"]
# Excluded: particle emitters (by directory, and three that sit outside it), Xcode project
# metadata, and colour-lookup tables — none of which are spritesheets. Content detection
# caught the three strays; the naming convention alone would not have.
exclude_paths = [
  "tests/**/Particles/**/*.plist",
  "tests/**/*article*.plist",
  "tests/**/*Particle*.plist",
  "tests/**/Images/BoilingFoam.plist",
  "tests/**/Info.plist",
  "tests/**/exportoptions.plist",
  "tests/**/lookup-*.plist",
  "tests/**/fonts/**/*charmap*.plist",   # bitmap-font charmaps -> bitmapfont-fixtures
  "tests/**/fonts/**/larabie*.plist",    # ditto
  "tests/**/fileLookup.plist",   # cocosbuilder path table, not an atlas
  "tests/**/configs/*.plist",    # engine config, not an atlas
]
strip = "tests/"
dest = "cocos/"

[source.license]
declared = "MIT"
declared_scope = "repository-root"
declared_from = "README.md"
commercial_use = true
onward_use = "unrestricted"
covers = "cocos2d-x declares MIT in its README (no LICENSE file at the root). NOTE: licenses/LICENSE_artwork.txt covers the bundled artwork separately and NON-UNIFORMLY — six different licences across it: grossini*.png is CC BY-NC-SA 2.0 (redistributable, so -full and -demo eligible), several tile sets are GNU GPL v2, one is Common Public License, one carries a custom Lost Garden licence, Fonts/*.ttf say 'For personal Use', and tuffy_bold_italic-charmap.png is public domain. Critically, Images/spritesheet* carries 'LICENSE: unsure... don't use them in your project' — upstream declining to vouch for the very assets a spritesheet pack would want. This pack takes only text descriptors, so none of that reaches it; recorded because the descriptors reference those images by name and anyone rendering rather than parsing must read that file first."

# ---------------------------------------------------------------------------
# The frames+meta JSON dialect — what TexturePacker and Aseprite both emit, and what
# asepriteParse reads. A third serialisation alongside the libgdx text format and the Cocos
# property list, and the one most likely to appear in a modern toolchain.
#
# Found by accident: these were pulled while looking for Pixi emitter configs, and content
# detection showed they were spritesheets rather than particles.
# ---------------------------------------------------------------------------
[[source]]
id = "pixi-example-spritesheets"
kind = "upstream"
repo = "pixijs-userland/particle-emitter"
ref = "master"
fetch = "blobs"
include = ["docs/examples/images/**/*.json", "docs/examples/images/**/*.png"]
strip = "docs/examples/images/"
dest = "framesmeta/"

[source.license]
declared = "MIT"
declared_scope = "repository-root"
declared_from = "LICENSE"
commercial_use = true
onward_use = "unrestricted"
covers = "PixiJS particle-emitter example assets."

# ---------------------------------------------------------------------------
# Starling's SubTexture XML, from the framework's own demo assets — and at two scale
# factors, 1x and 2x, which is how Starling ships resolution variants. Same atlas, different
# density, so a reader that hardcodes assumptions about page size has somewhere to fail.
# ---------------------------------------------------------------------------
[[source]]
id = "starling-atlas-xml"
kind = "upstream"
repo = "Gamua/Starling-Framework"
ref = "master"
fetch = "blobs"
include = ["samples/**/assets/textures/**/*.xml", "samples/**/assets/textures/**/*.png"]
strip = "samples/"
dest = "starling/"

[source.license]
declared = "BSD-2-Clause"
declared_scope = "repository-root"
declared_from = "LICENSE.md"
commercial_use = true
onward_use = "unrestricted"
covers = "Starling Framework, copyright Gamua, under the Simplified BSD License stated in LICENSE.md. Demo texture atlases ship with the samples."
