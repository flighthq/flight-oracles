# spritesheet-fixtures — texture atlas and spritesheet descriptors.
#
# flight reads five atlas dialects across two packages (spritesheet-formats and
# textureatlas-formats): libgdx, TexturePacker, Starling, Cocos plist and Aseprite.
# Two dialects covered so far: libgdx .atlas and the Cocos property-list form. TexturePacker,
# Starling and Aseprite remain, named in docs/fixture-coverage.md.
#
# Only the DESCRIPTORS are taken, never the artwork they point at. A spritesheet parser is
# exercised entirely by the descriptor — frame rectangles, rotation flags, trim offsets — and
# the images would add weight plus, in cocos2d-x's case, a separate and more restrictive
# artwork licence.

[pack]
name = "spritesheet-fixtures"
kind = "fixtures"
summary = "Texture atlas descriptors — libgdx .atlas dialect, with page and region metadata."

[[source]]
id = "libgdx-atlas"
kind = "upstream"
repo = "libgdx/libgdx"
ref = "master"
fetch = "blobs"
include = ["tests/gdx-tests-android/assets/**/*.atlas", "extensions/gdx-tools/assets/**/*.atlas"]
strip = ""
dest = "libgdx/"

[source.license]
declared = "Apache-2.0"
declared_scope = "repository-root"
declared_from = "LICENSE"
commercial_use = true
onward_use = "unrestricted"
covers = "libgdx and its bundled test assets."


# ---------------------------------------------------------------------------
# Cocos property-list spritesheets: a completely different serialisation of the same model,
# which is exactly the kind of second dialect that catches assumptions baked into the first.
# ---------------------------------------------------------------------------
[[source]]
id = "cocos2dx-plist-sheets"
kind = "upstream"
repo = "cocos2d/cocos2d-x"
ref = "v4"
fetch = "blobs"
include = ["tests/**/*.plist"]
# Excluded: particle emitters (by directory, and three that sit outside it), Xcode project
# metadata, and colour-lookup tables — none of which are spritesheets. Content detection
# caught the three strays; the naming convention alone would not have.
exclude_paths = [
  "tests/**/Particles/**/*.plist",
  "tests/**/*article*.plist",
  "tests/**/*Particle*.plist",
  "tests/**/Images/BoilingFoam.plist",
  "tests/**/Info.plist",
  "tests/**/exportoptions.plist",
  "tests/**/lookup-*.plist",
  "tests/**/fonts/**/*charmap*.plist",   # bitmap-font charmaps -> bitmapfont-fixtures
  "tests/**/fonts/**/larabie*.plist",    # ditto
  "tests/**/fileLookup.plist",   # cocosbuilder path table, not an atlas
  "tests/**/configs/*.plist",    # engine config, not an atlas
]
strip = "tests/"
dest = "cocos/"

[source.license]
declared = "MIT"
declared_scope = "repository-root"
declared_from = "README.md"
commercial_use = true
onward_use = "unrestricted"
covers = "cocos2d-x declares MIT in its README (no LICENSE file at the root). NOTE: licenses/LICENSE_artwork.txt covers the bundled artwork separately and NON-UNIFORMLY — six different licences across it: grossini*.png is CC BY-NC-SA 2.0 (redistributable, so -full and -demo eligible), several tile sets are GNU GPL v2, one is Common Public License, one carries a custom Lost Garden licence, Fonts/*.ttf say 'For personal Use', and tuffy_bold_italic-charmap.png is public domain. Critically, Images/spritesheet* carries 'LICENSE: unsure... don't use them in your project' — upstream declining to vouch for the very assets a spritesheet pack would want. This pack takes only text descriptors, so none of that reaches it; recorded because the descriptors reference those images by name and anyone rendering rather than parsing must read that file first."
