# gltf-khronos-textures — raster textures for the Khronos glTF sample models.
#
# Completes gltf-khronos-fixtures for the external-resource form of glTF: a .gltf references
# its images by RELATIVE URI, so without these the models parse but cannot render.
#
# EXTRACTION: this pack and gltf-khronos-fixtures share a merge group. They must be
# extracted into the SAME directory or the relative references will not resolve — splitting
# them was a size decision, and glTF's own referencing model does not care about our size
# decisions. Consumers wanting self-contained textured models should prefer
# gltf-khronos-binary instead, where the textures are embedded.
#
# Screenshots are excluded: documentation images, not model resources.

[pack]
name = "gltf-khronos-textures"
kind = "fixtures"
merge_group = "gltf-khronos"
summary = "Raster textures for the Khronos glTF sample models — required to render the external-resource form."

[[source]]
id = "textures-abeautifulgame"
kind = "upstream"
repo = "KhronosGroup/glTF-Sample-Assets"
ref = "main"
fetch = "blobs"
include = ["Models/ABeautifulGame/glTF/**/*.png", "Models/ABeautifulGame/glTF/**/*.jpg", "Models/ABeautifulGame/glTF/**/*.jpeg", "Models/ABeautifulGame/glTF-Draco/**/*.png", "Models/ABeautifulGame/glTF-Draco/**/*.jpg", "Models/ABeautifulGame/glTF-Draco/**/*.jpeg", "Models/ABeautifulGame/glTF-KTX-BasisU/**/*.png", "Models/ABeautifulGame/glTF-KTX-BasisU/**/*.jpg", "Models/ABeautifulGame/glTF-KTX-BasisU/**/*.jpeg", "Models/ABeautifulGame/glTF-Quantized/**/*.png", "Models/ABeautifulGame/glTF-Quantized/**/*.jpg", "Models/ABeautifulGame/glTF-Quantized/**/*.jpeg", "Models/ABeautifulGame/glTF-Meshopt/**/*.png", "Models/ABeautifulGame/glTF-Meshopt/**/*.jpg", "Models/ABeautifulGame/glTF-Meshopt/**/*.jpeg", "Models/ABeautifulGame/glTF-WEBP/**/*.png", "Models/ABeautifulGame/glTF-WEBP/**/*.jpg", "Models/ABeautifulGame/glTF-WEBP/**/*.jpeg", "Models/ABeautifulGame/glTF-JPG-PNG/**/*.png", "Models/ABeautifulGame/glTF-JPG-PNG/**/*.jpg", "Models/ABeautifulGame/glTF-JPG-PNG/**/*.jpeg", "Models/ABeautifulGame/glTF-IBL/**/*.png", "Models/ABeautifulGame/glTF-IBL/**/*.jpg", "Models/ABeautifulGame/glTF-IBL/**/*.jpeg",
  "Models/ABeautifulGame/glTF-Meshopt-EXT/**/*.png", "Models/ABeautifulGame/glTF-Meshopt-EXT/**/*.jpg", "Models/ABeautifulGame/glTF-Meshopt-EXT/**/*.jpeg"]
