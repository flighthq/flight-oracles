# gltf-khronos-textures — raster textures for the Khronos glTF sample models.
#
# DECLARED, NOT INGESTED. Split from gltf-khronos-fixtures on size: 455 MB of .png/.jpg
# against 263 MB of geometry and JSON. No decoder path needs these in order to parse a
# glTF, so they are not parser coverage — they are what makes the models render, which is
# what demo and example use needs.
#
# Ingest this pack if you want the models to look right; skip it for parser testing.
# Per-model declarations are identical to gltf-khronos-fixtures because they come from the
# same LICENSE.md — including the four models that are not vendored at all.
[pack]
name = "gltf-khronos-textures"
kind = "fixtures"
summary = "Raster textures (PNG/JPEG) for the Khronos glTF sample models — demo and render content."

