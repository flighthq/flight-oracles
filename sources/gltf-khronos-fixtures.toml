# gltf-khronos-fixtures — Khronos glTF sample assets.
#
# One [[source]] per model, because the declarations are genuinely per-model: this corpus
# spans CC0-1.0, CC-BY-4.0, a Sony shared-source licence, Stanford's scan terms, an IKEA
# CC BY-NC-SA model, a Poser EULA, an Adobe Stock asset, a CRYENGINE agreement and a 3DRT
# testing licence. Reading the repository root as one declaration would misreport most of it.
#
# Blocks are generated from each model's upstream metadata.json (which carries a machine-
# readable `legal` array with SPDX ids) and reconciled by hand against the model's
# LICENSE.md and the bundled LICENSES/*.txt.
#
# SELECTION: models tagged core/testing/extension/pbrtest/issues. Models tagged
# showcase/video are excluded from v1 on size grounds (611 MB) — they are demo content
# rather than parser coverage and can become their own pack. The glTF-Binary (.glb)
# variant is likewise deferred: 455 MB of embedded-texture duplicates of geometry this
# pack already carries. See gltf-khronos-binary.toml.
#
# FILE TYPES: .gltf, .bin, .ktx2 and .webp only. Raster textures (.png/.jpg, 455 MB of the
# 718 MB this corpus would otherwise weigh) are a separate pack — no decoder path needs
# them in order to parse, and a missing external texture reference is itself a case worth
# testing. KTX2 and WebP stay because they are texture *containers* flight parses
# (`texture-formats`, EXT_texture_webp), not merely image payloads.
#
# fetch = "blobs": the repository is 1.4 GB. Blob mode lists the tree once and fetches only
# the selected files, so neither CI nor a contributor pays for the rest.

[pack]
name = "gltf-khronos-fixtures"
kind = "fixtures"
summary = "Khronos glTF 2.0 sample assets — core, testing and extension models covering the KHR/EXT extension surface."

