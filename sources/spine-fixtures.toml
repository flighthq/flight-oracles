# ---------------------------------------------------------------------------
# NO PER-EXAMPLE DECLARATION. Each of the nineteen examples above ships its own license.txt
# granting redistribution; `sack` and the whole spine-unity subtree ship none, and the
# repository root carries the Spine Runtimes License, which concerns the runtime SOFTWARE
# rather than example art. There is no declaration covering these files, and we say so
# rather than borrowing a sibling's terms.
#
# Included because they are genuine Spine runtime exports and the build input is where
# unestablished material belongs. onward_use = "unknown" keeps them out of -demo and
# -permissive automatically, so nothing published picks them up by accident.
# ---------------------------------------------------------------------------

[[source]]
id = "spine-sack"
kind = "upstream"
repo = "EsotericSoftware/spine-runtimes"
ref = "4.2"
include = ["examples/sack/export/**", "examples/sack/images/**"]
strip = "examples/"

[source.license]
declared = "UNKNOWN"
declared_scope = "repository-root"
commercial_use = "unknown"
onward_use = "unknown"
covers = "No per-example license.txt exists for this example, unlike its nineteen siblings. Nothing about redistribution is established; the absence is recorded rather than resolved."

[[source]]
id = "spine-unity-eyes"
