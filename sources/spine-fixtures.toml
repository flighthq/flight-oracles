# spine-fixtures — Spine skeletal animation example exports.
#
# Each example is a separate [[source]] because each ships its own license.txt and those
# declarations are NOT uniform: eighteen are Esoteric Software's own (redistributable with
# the licence file attached, non-commercial), and two are by third-party authors who
# explicitly forbid redistribution. Collapsing these into one repo-level declaration would
# have been wrong in both directions.

[pack]
name = "spine-fixtures"
kind = "fixtures"
summary = "Spine skeletal animation example exports (skeleton data, atlases, textures) from EsotericSoftware/spine-runtimes."

[[source]]
id = "spine-alien"
kind = "upstream"
repo = "EsotericSoftware/spine-runtimes"
ref = "4.2"
include = ["examples/alien/export/**", "examples/alien/images/**", "examples/alien/manual-maps/**"]
strip = "examples/"

[source.license]
declared = "LicenseRef-Spine-Examples-Redistributable-NonCommercial"
declared_scope = "file-adjacent"
declared_from = "examples/alien/license.txt"
commercial_use = false
onward_use = "non-commercial"
covers = "Images redistributable when accompanied by this licence file; the .spine project file is public domain. Copyright (c) 2013, Esoteric Software LLC."

