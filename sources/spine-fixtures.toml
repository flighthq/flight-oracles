repo = "EsotericSoftware/spine-runtimes"
ref = "4.2"
include = ["examples/spine-unity/eyes/import/**", "examples/spine-unity/eyes/images/**"]
strip = "examples/spine-unity/"
dest = "unity/"

[source.license]
declared = "UNKNOWN"
declared_scope = "repository-root"
commercial_use = "unknown"
onward_use = "unknown"
covers = "No per-example license.txt exists anywhere under examples/spine-unity/. Genuine Spine runtime exports (skeleton JSON, atlas, texture) with no declaration covering them."

