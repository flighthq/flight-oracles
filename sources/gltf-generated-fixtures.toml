# gltf-generated-fixtures — Khronos's procedurally generated conformance matrix.
#
# WHAT THE ORACLE ACTUALLY IS, stated precisely because an earlier draft of
# docs/fixture-coverage.md overstated it. The Manifest.json in each group lists the models
# and their camera placement; it does NOT carry per-property expected results. The
# expectation here is coarser and structural: the corpus is split into Output/Positive and
# Output/Negative, so the directory a file sits in IS the expected outcome —
#
#   Positive/  must parse. A rejection is a bug in the decoder.
#   Negative/  must be REJECTED. Acceptance is a bug in the decoder, and a silent one:
#              Mesh_NoPosition and Mesh_PrimitiveRestart are exactly the malformations a
#              lenient parser waves through and then renders as garbage.
#
# That pass/fail split is a genuine oracle, just a binary one. Per-case detail lives in each
# group's README.md (which tables what varies across the numbered cases) and, visually, in
# Figures/SampleImages — so the READMEs come along, and are worth reading rather than only
# shipping.
#
# COMPLEMENTS malformed-fixtures rather than duplicating it: these are AUTHORED invalid
# files, hand-built to violate one rule each, where ours are mechanical mutations. Authored
# invalidity finds spec-compliance bugs; mutation finds robustness bugs.
#
# Figures/ (111 MB of GIF and PNG reference renders) is excluded for now — it is visual
# expectation data, which is the phase deliberately being deferred.

[pack]
name = "gltf-generated-fixtures"
kind = "conformance"
summary = "Khronos glTF conformance matrix — positive and negative cases, where the directory split is the expected outcome."

[[source]]
id = "gltf-asset-generator"
kind = "upstream"
repo = "KhronosGroup/glTF-Asset-Generator"
ref = "main"
fetch = "blobs"
include = [
  "Output/**/*.gltf", "Output/**/*.bin",
  "Output/**/Manifest.json", "Output/**/README.md",
]
strip = "Output/"
dest = ""

[source.license]
declared = "MIT"
declared_scope = "repository-root"
declared_from = "LICENSE"
commercial_use = true
onward_use = "unrestricted"
covers = "KhronosGroup/glTF-Asset-Generator. Assets here are procedurally generated by the tool in this repository rather than authored art, so there is no third-party subject matter in them."
