  "tests/tests/swfs/stage3d/**/*.swf",
  "tests/tests/swfs/stage3d/**/output.txt",
  "tests/tests/swfs/stage3d/**/test.toml",
  "tests/tests/swfs/stage3d/**/output.expected.png",
  "tests/tests/swfs/stage3d/**/Test.as",
  "tests/tests/swfs/stage3d/**/test.as",
  "tests/tests/swfs/mixed_avm/**/*.swf",
  "tests/tests/swfs/mixed_avm/**/output.txt",
  "tests/tests/swfs/mixed_avm/**/test.toml",
  "tests/tests/swfs/mixed_avm/**/output.expected.png",
  "tests/tests/swfs/mixed_avm/**/Test.as",
  "tests/tests/swfs/mixed_avm/**/test.as",
  "tests/tests/swfs/swf/**/*.swf",
  "tests/tests/swfs/swf/**/output.txt",
