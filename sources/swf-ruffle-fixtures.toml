  "tests/tests/swfs/timeline/**/output.txt",
  "tests/tests/swfs/timeline/**/test.toml",
  "tests/tests/swfs/timeline/**/output.expected.png",
  "tests/tests/swfs/timeline/**/Test.as",
  "tests/tests/swfs/timeline/**/test.as",
  "tests/tests/swfs/text/**/*.swf",
  "tests/tests/swfs/text/**/output.txt",
  "tests/tests/swfs/text/**/test.toml",
  "tests/tests/swfs/text/**/output.expected.png",
  "tests/tests/swfs/text/**/Test.as",
  "tests/tests/swfs/text/**/test.as",
  "tests/tests/swfs/fonts/**/*.swf",
  "tests/tests/swfs/fonts/**/output.txt",
  "tests/tests/swfs/fonts/**/test.toml",
  "tests/tests/swfs/fonts/**/output.expected.png",
  "tests/tests/swfs/fonts/**/Test.as",
  "tests/tests/swfs/fonts/**/test.as",
  "tests/tests/swfs/audio/**/*.swf",
  "tests/tests/swfs/audio/**/output.txt",
  "tests/tests/swfs/audio/**/test.toml",
  "tests/tests/swfs/audio/**/output.expected.png",
