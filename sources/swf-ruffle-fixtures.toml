# swf-ruffle-fixtures — SWF test corpus from ruffle-rs/ruffle.
#
# FOUR source blocks, not one, because Ruffle's test tree carries four different
# declarations. Ruffle's own tests are Apache-2.0 OR MIT; the three imported corpora carry
# their ORIGIN's terms, which Ruffle documents per-subdirectory in from_*/README.md.
# Treating the repository-root licence as covering all of them would misreport three of the
# four. Ruffle already practises exactly this per-source provenance discipline — the split
# here mirrors theirs.

# ORACLES ARE IN THIS PACK, not a separate one. Ruffle stores each case as a directory:
# test.swf beside output.txt (the expected trace output), test.toml (the run configuration),
# the ActionScript source, and for visual cases output.expected.png. Splitting the .swf from
# its expectation would mean dismantling a directory that arrives coupled and inventing a
# join key to reassemble it — the exact situation the pack-boundary rule in
# docs/sourcing-policy.md exists to prevent.
#
# 4,291 output.txt files make this the second oracle-bearing pack after text-conformance,
# and by far the largest for flight's own code: trace output tests AVM semantics directly,
# which is where SWF compatibility bugs actually live. It is also textual and deterministic,
# so it avoids the golden-image problem that pixel comparison would bring.
#
# output.expected.png (342 files) IS pixel data — but it is Ruffle's reference render rather
# than something we generated, so a consumer can choose to compare against it, or ignore it,
# without us having taken a position on renderer determinism.

[pack]
name = "swf-ruffle-fixtures"
kind = "fixtures"
summary = "SWF fixtures from the Ruffle test suite, paired with their expected trace output — split by the declaration covering each subtree."

# ---------------------------------------------------------------------------
# Ruffle's own tests — AVM1/AVM2 semantics, rendering, timeline, text, audio.
# ---------------------------------------------------------------------------
[[source]]
id = "ruffle-authored"
kind = "upstream"
repo = "ruffle-rs/ruffle"
ref = "master"
include = [
  "tests/tests/swfs/avm1/**/*.swf",
  "tests/tests/swfs/avm1/**/output.txt",
  "tests/tests/swfs/avm1/**/test.toml",
  "tests/tests/swfs/avm1/**/output.expected.png",
  "tests/tests/swfs/avm1/**/Test.as",
  "tests/tests/swfs/avm1/**/test.as",
  "tests/tests/swfs/avm2/**/*.swf",
  "tests/tests/swfs/avm2/**/output.txt",
  "tests/tests/swfs/avm2/**/test.toml",
  "tests/tests/swfs/avm2/**/output.expected.png",
  "tests/tests/swfs/avm2/**/Test.as",
  "tests/tests/swfs/avm2/**/test.as",
  "tests/tests/swfs/visual/**/*.swf",
  "tests/tests/swfs/visual/**/output.txt",
  "tests/tests/swfs/visual/**/test.toml",
  "tests/tests/swfs/visual/**/output.expected.png",
  "tests/tests/swfs/visual/**/Test.as",
  "tests/tests/swfs/visual/**/test.as",
