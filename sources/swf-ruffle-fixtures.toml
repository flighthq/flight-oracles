  "tests/tests/swfs/from_avmplus/**/Test.as",
  "tests/tests/swfs/from_avmplus/**/test.as",
]
strip = "tests/tests/swfs/"

[source.license]
declared = "MPL-2.0"
declared_scope = "directory"
declared_from = "tests/tests/swfs/from_avmplus/README.md"
commercial_use = true
covers = "Adobe avmplus ActionScript VM acceptance tests, imported by Ruffle."

