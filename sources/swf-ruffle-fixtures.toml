[source.license]
declared = "Apache-2.0 OR MIT"
declared_scope = "repository-root"
declared_from = "LICENSE.md"
commercial_use = true
covers = "Ruffle LLC and Ruffle contributors' authorship of the test SWFs."

# ---------------------------------------------------------------------------
# Imported from Gnash. GPL-3.0 carries an actual mechanical condition rather than a risk
# profile: the corresponding source for these generated SWFs is the Ming/swfmill/mtasc/swfc
# script that produced them, which lives in the Gnash tree. source_code records the pointer.
# ---------------------------------------------------------------------------
[[source]]
id = "ruffle-from-gnash"
kind = "upstream"
repo = "ruffle-rs/ruffle"
ref = "master"
include = [
  "tests/tests/swfs/from_gnash/**/*.swf",
  "tests/tests/swfs/from_gnash/**/output.txt",
  "tests/tests/swfs/from_gnash/**/test.toml",
  "tests/tests/swfs/from_gnash/**/output.expected.png",
  "tests/tests/swfs/from_gnash/**/Test.as",
  "tests/tests/swfs/from_gnash/**/test.as",
]
strip = "tests/tests/swfs/"

[source.license]
declared = "GPL-3.0-or-later"
declared_scope = "directory"
declared_from = "tests/tests/swfs/from_gnash/README.md"
commercial_use = true
source_code = "https://github.com/ruffle-rs/gnash-testsuite — Ruffle's fork of the Gnash testsuite, named by from_gnash/README.md as the origin of these modified tests. This, not upstream Gnash, is the corresponding source for the SWFs actually distributed here."
covers = "GNU Gnash project test cases, imported by Ruffle under their originating terms."

