# bitmapfont-fixtures — AngelCode BMFont descriptors.
#
# flight's bitmapfont-formats reads three serialisations of the same model: bitmapFontFnt
# (the original text .fnt), bitmapFontXml and bitmapFontJson. Both sources here ship the text
# form; the XML and JSON serialisations still need a corpus.
#
# Two producers rather than one on purpose. libgdx and cocos2d-x emit .fnt through different
# toolchains, and a parser written against a single producer's output tends to absorb its
# quirks — padding order, kerning presence, page-count assumptions — as if they were the
# format.
#
# Distinct from `font-signature-fixtures` in the coverage plan: those are four-byte magic
# numbers for TTF/OTF/WOFF container sniffing. These are glyph-atlas descriptors, a
# completely different thing that happens to share the word "font".

[pack]
name = "bitmapfont-fixtures"
kind = "fixtures"
merge_group = "cocos2dx"
summary = "AngelCode BMFont descriptors — the text .fnt serialisation."

[[source]]
id = "libgdx-bmfont"
kind = "upstream"
repo = "libgdx/libgdx"
ref = "master"
fetch = "blobs"
include = [
  "tests/gdx-tests-android/assets/**/*.fnt",
  "extensions/gdx-tools/assets/**/*.fnt",
  # Referenced by the descriptors above: without these they parse but cannot render.
  "tests/gdx-tests-android/assets/**/**/*.png",
  "tests/gdx-tests-android/assets/**/**/*.jpg",
  "tests/gdx-tests-android/assets/**/**/*.jpeg",
  "tests/gdx-tests-android/assets/**/**/*.bmp",
  "extensions/gdx-tools/assets/**/**/*.png",
  "extensions/gdx-tools/assets/**/**/*.jpg",
  "extensions/gdx-tools/assets/**/**/*.jpeg",
  "extensions/gdx-tools/assets/**/**/*.bmp",
]
strip = ""
dest = "libgdx/"

[source.license]
declared = "Apache-2.0"
declared_scope = "repository-root"
declared_from = "LICENSE"
commercial_use = true
onward_use = "unrestricted"
covers = "libgdx and its bundled test assets."


[[source]]
id = "cocos2dx-bmfont"
kind = "upstream"
repo = "cocos2d/cocos2d-x"
ref = "v4"
fetch = "blobs"
include = [
  "tests/**/*.fnt",
  # Charmap plists: a fixed-cell bitmap font described in a property list —
  # textureFilename, itemWidth, itemHeight, firstChar. Same model as .fnt in a
  # different serialisation, which is what bitmapfont-formats exists to handle.
  "tests/**/fonts/**/*.plist",
]
# bmfont-rotated-test.plist lives in fonts/ but is a spritesheet describing rotated
# frames, not a charmap. Content detection caught it; the directory suggested otherwise.
exclude_paths = ["tests/**/bmfont-rotated-test.plist"]
strip = "tests/"
dest = "cocos/"

[source.license]
declared = "MIT"
declared_scope = "repository-root"
declared_from = "README.md"
commercial_use = true
onward_use = "unrestricted"
covers = "cocos2d-x declares MIT in its README (no LICENSE file at the root). NOTE: licenses/LICENSE_artwork.txt covers the bundled artwork separately and NON-UNIFORMLY — six different licences across it: grossini*.png is CC BY-NC-SA 2.0 (redistributable, so -full and -demo eligible), several tile sets are GNU GPL v2, one is Common Public License, one carries a custom Lost Garden licence, Fonts/*.ttf say 'For personal Use', and tuffy_bold_italic-charmap.png is public domain. Critically, Images/spritesheet* carries 'LICENSE: unsure... don't use them in your project' — upstream declining to vouch for the very assets a spritesheet pack would want. This pack takes only text descriptors, so none of that reaches it; recorded because the descriptors reference those images by name and anyone rendering rather than parsing must read that file first."


# ---------------------------------------------------------------------------
# The one piece of cocos2d-x artwork with a clean declaration, and the one this pack
# actually needs: the texture its charmap plists reference by name. Public domain per
# licenses/LICENSE_artwork.txt ("SpriteSheet fonts ... LICENSE: Public Domain"), from
# tulrich.com/fonts. Without it the charmap descriptors parse but cannot be rendered.
#
# Deliberately NOT accompanied by the rest of that repository's artwork, which spans six
# licences including one the maintainers explicitly decline to vouch for.
# ---------------------------------------------------------------------------
[[source]]
id = "cocos2dx-charmap-texture"
kind = "upstream"
repo = "cocos2d/cocos2d-x"
ref = "v4"
fetch = "blobs"
include = ["tests/**/fonts/tuffy_bold_italic-charmap*.png"]
strip = "tests/"
dest = "cocos/"

[source.license]
declared = "LicenseRef-Public-Domain"
declared_scope = "directory"
declared_from = "licenses/LICENSE_artwork.txt"
commercial_use = true
onward_use = "unrestricted"
permissive = true
concluded = "Read licenses/LICENSE_artwork.txt: this texture is listed under 'SpriteSheet fonts' with 'LICENSE: Public Domain'. Public domain carries no conditions at all, so it belongs in -permissive; there is no SPDX identifier for a third party's public-domain declaration (CC0-1.0 is a dedication, which is a different act), hence the explicit conclusion."
covers = "Tuffy bold italic charmap texture, from tulrich.com/fonts. licenses/LICENSE_artwork.txt lists it under SpriteSheet fonts with LICENSE: Public Domain."
