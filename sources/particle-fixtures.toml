# particle-fixtures — particle effect configurations.
#
# flight's particles-formats reads six dialects: libgdx, ParticleDesigner, Pixi, Spine,
# Starling PEX and Unity. Two are covered here — libgdx .p and the ParticleDesigner
# property-list form that cocos2d-x ships. Pixi, Spine and Unity remain.
#
# ParticleDesigner and Starling PEX are near-relatives: PEX is the same emitter model in a
# different XML skin, so these plists are the closest thing to PEX coverage until a PEX
# corpus with a usable declaration turns up.
#
# Note that Spine particle configs are a seventh thing again and would come from the Spine
# corpus rather than here.

[pack]
name = "particle-fixtures"
kind = "fixtures"
merge_group = "cocos2dx"
summary = "Particle effect configurations — the libgdx .p dialect."

[[source]]
id = "libgdx-particles"
kind = "upstream"
repo = "libgdx/libgdx"
ref = "master"
fetch = "blobs"
include = [
  "tests/gdx-tests-android/assets/**/*.p",
  # Referenced by the descriptors above: without these they parse but cannot render.
  "tests/gdx-tests-android/assets/**/**/*.png",
  "tests/gdx-tests-android/assets/**/**/*.jpg",
  "tests/gdx-tests-android/assets/**/**/*.jpeg",
  "tests/gdx-tests-android/assets/**/**/*.bmp",
]
strip = "tests/gdx-tests-android/assets/"
dest = "libgdx/"

[source.license]
declared = "Apache-2.0"
declared_scope = "repository-root"
declared_from = "LICENSE"
commercial_use = true
onward_use = "unrestricted"
covers = "libgdx and its bundled test assets."


[[source]]
id = "cocos2dx-particledesigner"
kind = "upstream"
repo = "cocos2d/cocos2d-x"
ref = "v4"
fetch = "blobs"
include = [
  "tests/**/Particles/**/*.plist",
  "tests/**/*article*.plist",
  "tests/**/*Particle*.plist",
  "tests/**/Images/BoilingFoam.plist",   # an emitter filed under Images/
]
# SpriteFrame.plist sits in Particles/ but is a spritesheet, not an emitter.
exclude_paths = ["tests/**/Particles/SpriteFrame.plist"]
strip = "tests/"
dest = "cocos/"

[source.license]
declared = "MIT"
declared_scope = "repository-root"
declared_from = "README.md"
commercial_use = true
onward_use = "unrestricted"
covers = "cocos2d-x declares MIT in its README (no LICENSE file at the root). NOTE: licenses/LICENSE_artwork.txt covers the bundled artwork separately and NON-UNIFORMLY — six different licences across it: grossini*.png is CC BY-NC-SA 2.0 (redistributable, so -full and -demo eligible), several tile sets are GNU GPL v2, one is Common Public License, one carries a custom Lost Garden licence, Fonts/*.ttf say 'For personal Use', and tuffy_bold_italic-charmap.png is public domain. Critically, Images/spritesheet* carries 'LICENSE: unsure... don't use them in your project' — upstream declining to vouch for the very assets a spritesheet pack would want. This pack takes only text descriptors, so none of that reaches it; recorded because the descriptors reference those images by name and anyone rendering rather than parsing must read that file first."

# ---------------------------------------------------------------------------
# Starling PEX — a fourth dialect, and the XML one starlingPexParse reads.
#
# PEX is the ParticleDesigner emitter model in an XML skin, so it is the near-relative of the
# Cocos property lists above: same fields, different serialisation. Having both is what makes
# them useful, since a parser written against one tends to absorb its encoding assumptions.
#
# Each .pex names its texture in a <texture name="..."/> element, so the images come too or
# nothing renders.
# ---------------------------------------------------------------------------
[[source]]
id = "starling-pex-demo"
kind = "upstream"
repo = "Gamua/Starling-Extension-Particle-System"
ref = "master"
include = ["demo/media/**/*.pex", "demo/media/**/*.png", "demo/media/**/*.jpg"]
strip = "demo/media/"
dest = "pex/starling/"

[source.license]
declared = "BSD-2-Clause"
declared_scope = "repository-root"
declared_from = "LICENSE.md"
commercial_use = true
onward_use = "unrestricted"
covers = "Starling particle-system extension, copyright 2011 Gamua, under the Simplified BSD License stated in LICENSE.md."

# ---------------------------------------------------------------------------
# Two more PEX producers, from third-party editors. Four emitters from one demo is thin
# coverage for a dialect, and these come from different tools — which is the point, since
# encoder quirks are what a second producer exposes.
#
# NEITHER CARRIES A DECLARATION: no LICENSE file, no SPDX metadata. Recorded as UNKNOWN with
# onward_use unknown, so they are build input only.
# ---------------------------------------------------------------------------
[[source]]
id = "particledesigner-pex"
kind = "upstream"
repo = "cosmindolha/ParticleDesigner"
ref = "master"
fetch = "blobs"
include = ["bin/assets/**/*.pex", "bin/assets/**/*.png"]
strip = "bin/assets/"
dest = "pex/particledesigner/"

[source.license]
declared = "UNKNOWN"
declared_scope = "repository-root"
commercial_use = "unknown"
onward_use = "unknown"
covers = "cosmindolha/ParticleDesigner carries no licence declaration of any kind. Taken for producer variety in the PEX dialect; nothing about its terms is established."

[[source]]
id = "starling-particle-editor-pex"
kind = "upstream"
repo = "devon-o/Starling-Particle-Editor"
ref = "master"
include = ["assets/**/*.pex", "assets/**/*.png"]
strip = "assets/"
dest = "pex/editor/"

[source.license]
declared = "UNKNOWN"
declared_scope = "repository-root"
commercial_use = "unknown"
onward_use = "unknown"
covers = "devon-o/Starling-Particle-Editor carries no licence declaration of any kind. Taken for producer variety in the PEX dialect; nothing about its terms is established."

# Unity's native YAML lives in its own pack, unity-native-fixtures, because it is NOT one of
# the dialects particles-formats reads — see that spec, and docs/fixture-coverage.md, for why
# UnityParticleDocument has no upstream corpus by construction.
