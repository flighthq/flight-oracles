# EDGE CASE, added deliberately: Resource URIs containing SPACES, in the glTF's own buffer and image references.
# These two carry no tags in metadata.json, so the tag-based selection that built this file
# skipped them. That was a selection bug rather than a size decision - a resource resolver
# that mishandles a space or a non-ASCII byte fails on exactly these and on nothing else here.

