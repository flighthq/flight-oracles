# gltf-khronos-binary — the .glb container variant of the Khronos sample models.
#
# DECLARED, NOT INGESTED. 455 MB, and largely duplicative: a .glb embeds the same geometry
# and textures the glTF variant carries separately. Worth adopting when GLB container
# handling specifically needs coverage beyond the handful of .glb files a smaller sample
# would give; not worth 455 MB by default.
[pack]
name = "gltf-khronos-binary"
kind = "fixtures"
summary = "GLB container variant of the Khronos glTF sample models."

[[source]]
id = "binary-abeautifulgame"
kind = "upstream"
repo = "KhronosGroup/glTF-Sample-Assets"
ref = "main"
fetch = "blobs"
include = ["__none__"]
strip = "Models/"

[source.license]
declared = "CC-BY-4.0"
declared_scope = "file-adjacent"
declared_from = "Models/ABeautifulGame/LICENSE.md"
commercial_use = true
covers = "Original model — MaterialX Project, 2020 (owner: ASWF)."

