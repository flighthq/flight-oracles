# gltf-khronos-binary — GLB container fixtures, self-contained.
#
# flight parses the binary container (chunked JSON + BIN, textures embedded) as a distinct
# code path from glTF-with-external-resources. Two reasons this pack carries all of them
# rather than a token sample:
#
#   1. TESTING. A container bug can hide in any model; sampling the smallest 40 covered the
#      happy path and nothing else.
#   2. DEMOS. A .glb embeds its textures, so it is the SELF-CONTAINED form — one file per
#      model, nothing to resolve. That makes this the pack to reach for when rendering
#      something, rather than fixtures+textures extracted into a shared tree.
#
# Declarations are per-model and identical to gltf-khronos-fixtures; same LICENSE.md.

[pack]
name = "gltf-khronos-binary"
kind = "fixtures"
summary = "GLB container fixtures — Khronos sample models in self-contained binary glTF form, textures embedded."

[[source]]
id = "glb-abeautifulgame"
kind = "upstream"
repo = "KhronosGroup/glTF-Sample-Assets"
ref = "main"
fetch = "blobs"
include = ["Models/ABeautifulGame/glTF-Binary/**/*.glb"]
strip = "Models/"

[source.license]
declared = "CC-BY-4.0"
declared_scope = "file-adjacent"
declared_from = "Models/ABeautifulGame/LICENSE.md"
commercial_use = true
covers = "Original model — MaterialX Project, 2020 (owner: ASWF)."

