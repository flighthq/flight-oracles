# gltf-khronos-binary — GLB container coverage.
#
# flight parses the binary container (chunked JSON + BIN) as a distinct code path from
# glTF-with-external-resources, and gltf-khronos-fixtures carries ZERO .glb files. That is a
# real coverage hole rather than a size trade-off.
#
# Taking all 120 would cost 455 MB, most of it re-encoded copies of geometry and textures the
# glTF pack already holds. Exercising a container does not require every model, so this is
# the 40 smallest — the parsing path at a fraction of the weight. Widen it if a GLB defect
# ever needs a model that is not here.
#
# Declarations are per-model and identical to gltf-khronos-fixtures; they come from the same
# LICENSE.md.

[pack]
name = "gltf-khronos-binary"
kind = "fixtures"
summary = "GLB container fixtures — the 40 smallest Khronos sample models in binary glTF form."

[[source]]
id = "glb-animatedcolorscube"
kind = "upstream"
repo = "KhronosGroup/glTF-Sample-Assets"
ref = "main"
fetch = "blobs"
include = ["Models/AnimatedColorsCube/glTF-Binary/**/*.glb"]
strip = "Models/"

[source.license]
declared = "CC0-1.0"
declared_scope = "file-adjacent"
declared_from = "Models/AnimatedColorsCube/LICENSE.md"
commercial_use = true
covers = "Everything — Ed Mackey, 2024 (owner: Public)."

