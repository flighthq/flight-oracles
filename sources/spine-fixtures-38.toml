# spine-fixtures-38 — Spine 3.8 exports.
#
# A DIFFERENT FORMAT VERSION, kept as its own pack rather than mixed into spine-fixtures.
#
# flight's spineBinaryParse.ts claims only the 4.x line and REJECTS 3.8 outright: "a
# mismatched layout desynchronizes the stream and yields plausible-looking garbage". That
# rejection is a code path with no fixtures behind it — nothing in the 4.2 corpus can prove
# a 3.8 file is refused rather than silently mis-parsed, which is the failure mode with no
# symptom. This pack exists to exercise exactly that.
#
# So it is a NEGATIVE corpus for the binary importer, and a positive one for anything that
# does support 3.8. Same per-example licence structure as 4.2, read independently.

[pack]
name = "spine-fixtures-38"
kind = "fixtures"
summary = "Spine 3.8 example exports — prior format version, for compatibility and rejection testing."

[[source]]
id = "spine38-alien"
kind = "upstream"
repo = "EsotericSoftware/spine-runtimes"
ref = "3.8"
include = ["examples/alien/export/**", "examples/alien/images/**", "examples/alien/manual-maps/**"]
strip = "examples/"

[source.license]
declared = "LicenseRef-Spine-Examples-Redistributable-NonCommercial"
declared_scope = "file-adjacent"
declared_from = "examples/alien/license.txt"
commercial_use = false
onward_use = "non-commercial"
covers = "Images redistributable when accompanied by this licence file; the .spine project file is public domain. Esoteric Software LLC."

